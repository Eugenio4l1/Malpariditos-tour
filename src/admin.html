<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar tours | Malpariditos Tours</title>
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html"><img class="brand__logo" src="img/logo.jpg" alt="" width="36" height="36"><span>Malpariditos Tours</span></a>
      <nav class="site-nav site-nav--static" aria-label="Principal">
        <div class="site-nav__actions"><a class="btn btn--secondary" href="catalogo.html">Catálogo</a></div>
      </nav>
    </div>
  </header>

  <main id="contenido" class="container form-page" tabindex="-1">
    <section class="form-card" aria-labelledby="titulo-admin">
      <h1 id="titulo-admin" data-admin-title>Administrar tour</h1>
      <p class="text-muted" data-admin-description>Gestiona los datos del tour con los permisos de administración.</p>
      <p class="form-status" data-admin-status role="status" hidden></p>
      <section class="tour-picker" aria-labelledby="titulo-seleccionar-tour" hidden>
        <div class="tour-picker__head">
          <div>
            <h2 id="titulo-seleccionar-tour">Editar un tour existente</h2>
            <p class="text-muted">Selecciona un tour para cargar sus datos reales.</p>
          </div>
          <button class="btn btn--secondary" type="button" data-refresh-tours>Actualizar lista</button>
        </div>
        <div class="field">
          <label class="field__label" for="existing-tour">Tour</label>
          <select class="field__control" id="existing-tour" data-existing-tour>
            <option value="">Crear un tour nuevo</option>
          </select>
        </div>
        <p class="field__error" data-tour-list-error hidden></p>
      </section>
      <form id="tour-form" novalidate hidden>
        <div class="form-grid">
          <div class="field">
            <label class="field__label" for="tour-categoria">Categoría</label>
            <input class="field__control" id="tour-categoria" name="categoria_id" type="number" min="1" required>
            <p class="field__error" data-error-for="categoria_id" hidden></p>
          </div>
          <div class="field">
            <label class="field__label" for="tour-nombre">Nombre</label>
            <input class="field__control" id="tour-nombre" name="nombre" type="text" minlength="3" maxlength="150" required>
            <p class="field__error" data-error-for="nombre" hidden></p>
          </div>
          <div class="field form-grid__wide">
            <label class="field__label" for="tour-descripcion">Descripción</label>
            <textarea class="field__control" id="tour-descripcion" name="descripcion" maxlength="2000" rows="5"></textarea>
            <p class="field__error" data-error-for="descripcion" hidden></p>
          </div>
          <div class="field">
            <label class="field__label" for="tour-precio">Precio</label>
            <input class="field__control" id="tour-precio" name="precio" type="number" min="0" max="999999.99" step="0.01" required>
            <p class="field__error" data-error-for="precio" hidden></p>
          </div>
          <div class="field">
            <label class="field__label" for="tour-duracion">Duración en horas</label>
            <input class="field__control" id="tour-duracion" name="duracion_horas" type="number" min="1" max="24" required>
            <p class="field__error" data-error-for="duracion_horas" hidden></p>
          </div>
          <div class="field">
            <label class="field__label" for="tour-estado">Estado</label>
            <select class="field__control" id="tour-estado" name="estado" required>
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
            <p class="field__error" data-error-for="estado" hidden></p>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn--secondary" href="catalogo.html">Cancelar</a>
          <button class="btn btn--secondary" type="button" data-cancel-edit hidden>Cancelar edición</button>
          <button class="btn btn--primary" type="submit" data-tour-submit>Guardar tour</button>
        </div>
      </form>
    </section>
  </main>
  <script type="module" src="modules/admin.js"></script>
</body>
</html>
