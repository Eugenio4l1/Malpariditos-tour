<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar | Malpariditos Tours</title>
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html"><img class="brand__logo" src="img/logo.jpg" alt="" width="36" height="36"><span>Malpariditos Tours</span></a>
      <nav class="site-nav site-nav--static" aria-label="Principal">
        <div class="site-nav__actions"><a class="btn btn--secondary" href="catalogo.html">Volver al catálogo</a></div>
      </nav>
    </div>
  </header>

  <main id="contenido" class="container form-page" tabindex="-1">
    <section class="form-card" aria-labelledby="titulo-login">
      <h1 id="titulo-login">Ingresar</h1>
      <p class="text-muted">Utiliza tus credenciales para continuar.</p>
      <p class="form-status" data-login-status role="status" hidden></p>
      <form id="login-form" novalidate>
        <div class="field">
          <label class="field__label" for="login-email">Correo electrónico</label>
          <input class="field__control" id="login-email" name="email" type="email" autocomplete="email" required>
          <p class="field__error" data-error-for="email" hidden></p>
        </div>
        <div class="field">
          <label class="field__label" for="login-password">Contraseña</label>
          <input class="field__control" id="login-password" name="password" type="password" autocomplete="current-password" required>
          <p class="field__error" data-error-for="password" hidden></p>
        </div>
        <button class="btn btn--primary btn--block" type="submit" data-login-submit>Ingresar</button>
      </form>
    </section>
  </main>
  <script type="module" src="modules/login.js"></script>
</body>
</html>
