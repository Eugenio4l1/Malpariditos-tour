components:
  schemas:
    CategoriaResource:
      type: object
      properties:
        id:
          type: integer
          description: 'Identificador de la categoría.'
          examples:
            - 1
        nombre:
          type: string
          description: 'Nombre de la categoría.'
          examples:
            - Aventura
        descripcion:
          type:
            - string
            - 'null'
          description: 'Descripción opcional.'
          examples:
            - 'Rutas al aire libre entre bosques, ríos y volcanes.'
      required:
        - id
        - nombre
        - descripcion
      title: CategoriaResource
    ReservaResource:
      type: object
      properties:
        id:
          type: integer
          description: 'Identificador de la reserva.'
          examples:
            - 7
        cliente_id:
          type: integer
          description: 'Identificador del cliente que reserva.'
          examples:
            - 1
        salida_tour_id:
          type: integer
          description: 'Identificador de la salida reservada.'
          examples:
            - 3
        cantidad_personas:
          type: integer
          description: 'Cantidad de personas (1 a 20).'
          examples:
            - 2
        fecha_reserva:
          type: string
          format: date-time
          description: 'Fecha en que se registró la reserva.'
          examples:
            - '2026-10-15T00:00:00-06:00'
        estado:
          type: string
          description: 'Estado de la reserva.'
          enum:
            - pendiente
            - confirmada
            - cancelada
          examples:
            - pendiente
        total:
          type: number
          description: 'Total calculado (incluye el descuento del 10 % desde 5 personas).'
          examples:
            - 90000
        creado_en:
          type:
            - string
            - 'null'
          format: date-time
          description: 'Fecha de creación.'
          examples:
            - '2026-09-20T10:15:00-06:00'
        actualizado_en:
          type:
            - string
            - 'null'
          format: date-time
          description: 'Fecha de la última actualización.'
          examples:
            - '2026-09-20T10:15:00-06:00'
      required:
        - id
        - cliente_id
        - salida_tour_id
        - cantidad_personas
        - fecha_reserva
        - estado
        - total
        - creado_en
        - actualizado_en
      title: ReservaResource
    SalidaTourResource:
      type: object
      properties:
        id:
          type: integer
          description: 'Identificador de la salida.'
          examples:
            - 3
        tour_id:
          type: integer
          description: 'Identificador del tour al que pertenece.'
          examples:
            - 1
        fecha:
          type: string
          format: date
          description: 'Fecha de la salida.'
          examples:
            - '2026-10-15'
        hora:
          type: string
          description: 'Hora de la salida.'
          examples:
            - '09:00:00'
        cupo_maximo:
          type: integer
          description: 'Cupo máximo de personas.'
          examples:
            - 12
        estado:
          type: string
          description: 'Estado de la salida.'
          examples:
            - programada
      required:
        - id
        - tour_id
        - fecha
        - hora
        - cupo_maximo
        - estado
      title: SalidaTourResource
    StoreReservaEstadoRequest:
      type: object
      properties:
        estado:
          type: string
          description: 'Estado al que pasa la reserva.'
          enum:
            - confirmada
            - cancelada
          examples:
            - confirmada
      required:
        - estado
      title: StoreReservaEstadoRequest
    StoreReservaRequest:
      type: object
      properties:
        cliente_id:
          type: integer
          description: 'Identificador del cliente (debe existir).'
          examples:
            - 1
        salida_tour_id:
          type: integer
          description: 'Identificador de la salida (debe existir). Un cliente no puede tener dos reservas activas para la misma salida.'
          examples:
            - 3
        cantidad_personas:
          type: integer
          description: 'Cantidad de personas (1 a 20). Desde 5 personas se aplica un 10 % de descuento.'
          examples:
            - 2
          minimum: 1
          maximum: 20
        fecha_reserva:
          type: string
          format: date-time
          description: 'Fecha de la reserva.'
          examples:
            - '2026-10-15'
      required:
        - cliente_id
        - salida_tour_id
        - cantidad_personas
        - fecha_reserva
      title: StoreReservaRequest
    StoreTourRequest:
      type: object
      properties:
        categoria_id:
          type: integer
          description: 'Identificador de la categoría (debe existir).'
          examples:
            - 1
        nombre:
          type: string
          description: 'Nombre único del tour (3 a 150 caracteres).'
          examples:
            - 'Caminata al volcán Rincón de la Vieja'
          minLength: 3
          maxLength: 150
        descripcion:
          type:
            - string
            - 'null'
          description: 'Descripción opcional (máximo 2000 caracteres).'
          examples:
            - 'Recorrido guiado de medio día por el parque nacional.'
          maxLength: 2000
        precio:
          type: number
          description: 'Precio por persona (0 a 999999.99).'
          examples:
            - 45000
          minimum: 0
          maximum: 999999.99
        duracion_horas:
          type: integer
          description: 'Duración en horas (1 a 24).'
          examples:
            - 4
          minimum: 1
          maximum: 24
        estado:
          type: string
          description: 'Estado comercial del tour.'
          enum:
            - activo
            - inactivo
          examples:
            - activo
      required:
        - categoria_id
        - nombre
        - precio
        - duracion_horas
        - estado
      title: StoreTourRequest
    TourResource:
      type: object
      properties:
        id:
          type: integer
          description: 'Identificador del tour.'
          examples:
            - 12
        categoria_id:
          type: integer
          description: 'Identificador de la categoría a la que pertenece.'
          examples:
            - 1
        nombre:
          type: string
          description: 'Nombre único del tour.'
          examples:
            - 'Caminata al volcán Rincón de la Vieja'
        descripcion:
          type:
            - string
            - 'null'
          description: 'Descripción opcional.'
          examples:
            - 'Recorrido guiado de medio día por el parque nacional.'
        precio:
          type: number
          description: 'Precio por persona.'
          examples:
            - 45000
        duracion_horas:
          type: integer
          description: 'Duración en horas (1 a 24).'
          examples:
            - 4
        estado:
          type: string
          description: 'Estado comercial del tour.'
          enum:
            - activo
            - inactivo
          examples:
            - activo
        categoria:
          description: 'Categoría del tour. Solo se incluye cuando está cargada (listado y detalle).'
          $ref: '#/components/schemas/CategoriaResource'
        creado_en:
          type:
            - string
            - 'null'
          format: date-time
          description: 'Fecha de creación.'
          examples:
            - '2026-09-20T10:15:00-06:00'
        actualizado_en:
          type:
            - string
            - 'null'
          format: date-time
          description: 'Fecha de la última actualización.'
          examples:
            - '2026-09-20T10:15:00-06:00'
      required:
        - id
        - categoria_id
        - nombre
        - descripcion
        - precio
        - duracion_horas
        - estado
        - creado_en
        - actualizado_en
      title: TourResource
    UpdateReservaRequest:
      type: object
      properties:
        cantidad_personas:
          type: integer
          description: 'Nueva cantidad de personas (1 a 20).'
          examples:
            - 4
          minimum: 1
          maximum: 20
        fecha_reserva:
          type: string
          format: date-time
          description: 'Nueva fecha de la reserva.'
          examples:
            - '2026-10-20'
      title: UpdateReservaRequest
    UpdateTourRequest:
      type: object
      properties:
        categoria_id:
          type: integer
          description: 'Identificador de la categoría (debe existir).'
          examples:
            - 2
        nombre:
          type: string
          description: 'Nombre único del tour (3 a 150 caracteres).'
          examples:
            - 'Caminata nocturna al volcán'
          minLength: 3
          maxLength: 150
        descripcion:
          type:
            - string
            - 'null'
          description: 'Descripción opcional (máximo 2000 caracteres).'
          examples:
            - 'Ahora con transporte incluido.'
          maxLength: 2000
        precio:
          type: number
          description: 'Precio por persona (0 a 999999.99).'
          examples:
            - 52000
          minimum: 0
          maximum: 999999.99
        duracion_horas:
          type: integer
          description: 'Duración en horas (1 a 24).'
          examples:
            - 5
          minimum: 1
          maximum: 24
        estado:
          type: string
          description: 'Estado comercial del tour.'
          enum:
            - activo
            - inactivo
          examples:
            - inactivo
      title: UpdateTourRequest
